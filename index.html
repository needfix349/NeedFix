  <body class="bg-slate-50 text-slate-900 font-sans antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js')
            .then(function(registration) {
              console.log('[NeedFix PWA] Service Worker active with scope:', registration.scope);
            })
            .catch(function(error) {
              console.warn('[NeedFix PWA] Service Worker registration note:', error);
            });
        });
      }
    </script>
  </body>
